<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot-news" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="slurp" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="duckduckbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="baiduspider" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="yandexbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="applebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DILG Cebu Province</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        @font-face {
            font-family: "Moon Time";
            src: url("assets/fonts/moon-time-regular.ttf") format("truetype");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 18px;
            color: #050505;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(90deg, rgba(255,255,255,0.94), rgba(255,255,255,0.78), rgba(255,255,255,0.94)),
                url("images/mainpagealbum/17.jpg") center / cover fixed no-repeat;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            left: 50%;
            width: min(86vw, 980px);
            height: 10px;
            transform: translateX(-50%) skewX(-22deg);
            background: repeating-linear-gradient(
                90deg,
                #050505 0 8px,
                transparent 8px 13px
            );
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            top: 28px;
        }

        body::after {
            bottom: 28px;
        }

        .maintenance-shell {
            position: relative;
            z-index: 1;
            width: min(980px, 100%);
            min-height: min(680px, calc(100vh - 96px));
            display: grid;
            place-items: center;
            padding: clamp(28px, 6vw, 72px);
            border-left: 7px solid #f8b400;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 22px 70px rgba(0, 42, 84, 0.18);
            backdrop-filter: blur(4px);
            text-align: center;
        }

        .maintenance-shell::before {
            content: "";
            position: absolute;
            inset: 18px;
            border: 1px solid rgba(0, 62, 126, 0.16);
            border-radius: 4px;
            pointer-events: none;
        }

        .maintenance-content {
            position: relative;
            z-index: 1;
            display: grid;
            justify-items: center;
            gap: 22px;
        }

        .logo-frame {
            position: relative;
            width: clamp(132px, 18vw, 190px);
            height: clamp(132px, 18vw, 190px);
            display: grid;
            place-items: center;
            border-radius: 50%;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 18px 38px rgba(0, 62, 126, 0.18);
        }

        .logo-frame::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 3px solid #ed1c24;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
        }

        .logo-video,
        .logo-fallback {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.08);
        }

        .logo-fallback {
            display: none;
            object-fit: contain;
            transform: none;
        }

        .logo-frame.video-failed .logo-video,
        .logo-frame:not(.video-ready) .logo-video {
            display: none;
        }

        .logo-frame.video-failed .logo-fallback,
        .logo-frame:not(.video-ready) .logo-fallback {
            display: block;
        }

        .eyebrow {
            margin: 2px 0 0;
            padding: 7px 16px;
            border: 1px solid #f8b400;
            color: #003e7e;
            font-size: clamp(13px, 1.5vw, 16px);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255,255,255,0.7);
        }

        h1 {
            max-width: 820px;
            margin: 0;
            color: #003e7e;
            font-size: clamp(36px, 7vw, 76px);
            line-height: 0.95;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        h1 .sugbo {
            display: inline-block;
            color: #050505;
            font-family: "Moon Time", cursive;
            font-size: 1.22em;
            font-weight: 700;
            text-transform: none;
            transform: translateY(0.08em);
        }

        .message {
            max-width: 720px;
            margin: 0;
            color: #111111;
            font-size: clamp(18px, 2.2vw, 25px);
            font-weight: 700;
            line-height: 1.35;
        }

        .status-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 4px;
        }

        .status-chip {
            min-width: 160px;
            padding: 13px 18px;
            border: 1px solid rgba(0, 62, 126, 0.18);
            color: #003e7e;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            background: rgba(248, 251, 255, 0.92);
        }

        .return-note {
            margin: 8px 0 0;
            color: #333333;
            font-size: 15px;
            font-weight: 700;
        }

        @media (max-width: 640px) {
            body {
                padding: 24px 12px;
            }

            body::before {
                top: 14px;
            }

            body::after {
                bottom: 14px;
            }

            .maintenance-shell {
                min-height: calc(100vh - 64px);
                padding: 36px 18px;
                border-left-width: 5px;
            }

            .maintenance-shell::before {
                inset: 10px;
            }

            .status-chip {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="maintenance-shell" aria-labelledby="maintenance-title">
        <section class="maintenance-content">
            <div class="logo-frame">
                <video class="logo-video" autoplay muted loop playsinline preload="metadata" aria-label="DILG Cebu Province logo animation">
                    <source src="images/videos/logo.mp4" type="video/mp4">
                </video>
                <img class="logo-fallback" src="wp-content/uploads/2019/10/dilg-logo.png?v=2" alt="DILG Cebu Province logo">
            </div>

            <p class="eyebrow">Website Maintenance</p>

            <h1 id="maintenance-title">
                DILG <span class="sugbo">Sugbo</span> is updating
            </h1>

            <p class="message">
                We are improving the website to serve the public better. Please check back again shortly.
            </p>

            <div class="status-row" aria-label="Maintenance status">
                <div class="status-chip">Systems Refresh</div>
                <div class="status-chip">Content Update</div>
                <div class="status-chip">Public Access Soon</div>
            </div>

            <p class="return-note">Department of the Interior and Local Government - Cebu Province</p>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll(".logo-frame").forEach(function (logo) {
                const video = logo.querySelector(".logo-video");
                if (!video) return;

                function useFallback() {
                    logo.classList.remove("video-ready");
                    logo.classList.add("video-failed");
                }

                video.addEventListener("canplay", function () {
                    logo.classList.add("video-ready");
                    logo.classList.remove("video-failed");
                }, { once: true });

                video.addEventListener("error", useFallback, { once: true });

                const playAttempt = video.play();
                if (playAttempt && typeof playAttempt.catch === "function") {
                    playAttempt.catch(useFallback);
                }
            });
        });
    </script>
  <script src="assets/js/pdfjs-overlay-dialog.js" defer></script>
</body>
</html>
